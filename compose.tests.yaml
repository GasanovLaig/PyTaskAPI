services:
  # Отдельная чистая БД для тестов (поднимается только на время тестов)
  test_db:
    image: postgres:16-alpine
    container_name: pytaskapi_test_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pytaskapi_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pytaskapi_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Изолированный тестовый Redis
  test_redis:
    image: redis:7-alpine
    container_name: pytaskapi_test_redis_container
    ports:
      - "6381:6379"

  # Переопределяем поведение сервиса web для прогона тестов pytest -v
  test_runner:
    build: .
    container_name: pytaskapi_test_runner_container
    env_file:
      - .env.tests
    environment:
      - TEST_DB_HOST=test_db
      - TEST_DB_PORT=5432
      - TEST_DB_USER=postgres
      - TEST_DB_PASSWORD=postgres
      - TEST_DB_NAME=pytaskapi_test_db

      - TEST_REDIS_HOST=test_redis
      - TEST_REDIS_PORT=6379
    volumes:
      - .:/code
    command: pytest -v
    depends_on:
      test_db:
        condition: service_healthy
      test_redis:
        condition: service_started
