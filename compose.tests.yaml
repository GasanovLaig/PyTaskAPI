services:
  # Отдельная чистая БД для тестов (поднимается только на время тестов)
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pytaskapi_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pytaskapi_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Изолированный тестовый Redis
  test_redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  test_clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8124:8123"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Переопределяем поведение сервиса web для прогона тестов pytest -v
  test_runner:
    build:
      context: .
      target: runtime
    env_file:
      - .env.tests
    environment:
      - TEST_DB_HOST=test_db
      - TEST_DB_PORT=5432
      - TEST_REDIS_HOST=test_redis
      - TEST_REDIS_PORT=6379
      - TEST_CLICKHOUSE_HOST=test_clickhouse
      - TEST_CLICKHOUSE_PORT=8123
    volumes:
      - .:/code
    command: pytest -v
    depends_on:
      test_db:
        condition: service_healthy
      test_redis:
        condition: service_healthy
      test_clickhouse:
        condition: service_healthy
