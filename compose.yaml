services:
  # 1. БАЗА ДАННЫХ POSTGRESQL
  db:
    image: postgres:16-alpine
    container_name: pytaskapi_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. БРОКЕР СООБЩЕНИЙ REDIS
  redis:
    image: redis:7-alpine
    container_name: pytaskapi_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # 3. ПЕРЕХВАТЧИК ПИСЕМ MAILHOG
  mailhog:
    image: mailhog/mailhog
    container_name: pytaskapi_hog
    restart: always
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"

  # 4. ВЕБ-ПРИЛОЖЕНИЕ FASTAPI
  web:
    build: .
    container_name: pytaskapi_web
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 5. ФОНОВЫЙ ВОРКЕР CELERY
  worker:
    build: .
    container_name: pytaskapi_worker
    restart: always
    env_file:
      - .env
    volumes:
      - .:/code
    # Убрать пул селери на threads
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info -P threads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

volumes:
  postgres_data:
